<script>
/* ---------- lab content ---------- */
const STG=['Interphase','Prophase','Metaphase','Anaphase','Telophase','Cytokinesis'];
const PH=['Interphase','Prophase','Metaphase','Anaphase','Telophase'];
const PC=['I','P','M','A','T'];
const LET=['A','B','C','D','E'];
const COUNTS=[27,6,3,2,2];

const STAGE_INFO=[
  {d:`The cell grows (G1), copies its DNA (S), and prepares to divide (G2). The nucleus is visible and the chromatin is loose. By the end of G2, every chromosome has two identical sister chromatids.`,chr:'4',sub:'in one nucleus',cm:'2',cells:'1'},
  {d:`Chromatin coils tightly into chromosomes you can see. The nuclear envelope breaks down, and the centrosomes move to opposite poles as spindle fibers form.`,chr:'4',sub:'condensing',cm:'2',cells:'1'},
  {d:`Spindle fibers attach to the center of each chromosome. The chromosomes line up along the middle of the cell, called the metaphase plate.`,chr:'4',sub:'at the plate',cm:'2',cells:'1'},
  {d:`Sister chromatids separate and the spindle fibers pull them toward opposite poles. Each separated chromatid is now counted as its own chromosome.`,chr:'8',sub:'4 moving to each pole',cm:'1',cells:'1'},
  {d:`Chromosomes reach the poles and begin to uncoil. A new nuclear envelope forms around each set. The cell now has two nuclei.`,chr:'8',sub:'4 at each pole',cm:'1',cells:'1'},
  {d:`The cytoplasm divides. In animal cells the membrane pinches inward (cleavage furrow). Cytokinesis usually begins during late anaphase or telophase. The result is two genetically identical diploid cells.`,chr:'4',sub:'in each new cell',cm:'1',cells:'2'}
];

const PRED=[
  {q:`The cell has finished G1, S, and G2, so its DNA is copied. Mitosis begins with prophase. What will you see first?`,
   opts:[`Sister chromatids pull apart and move to opposite poles.`,`The chromatin coils into visible chromosomes and the nuclear envelope begins to break down.`,`The cell pinches in two.`],ok:1,
   why:`In prophase, chromatin condenses into chromosomes (each made of two sister chromatids), the nucleolus disappears, and spindle fibers begin to form.`},
  {q:`During prophase, spindle fibers attach to the chromosomes. Where will the chromosomes be in the next stage, metaphase?`,
   opts:[`Clustered at the two poles.`,`Back inside a new nucleus.`,`Lined up across the middle of the cell, called the metaphase plate.`],ok:2,
   why:`Spindle fibers from both poles tug on each chromosome until the chromosomes line up at the cell's equator. This makes sure each daughter cell gets one copy of every chromosome.`},
  {q:`Next is anaphase. What do the spindle fibers do to the chromosomes?`,
   opts:[`Pull the sister chromatids apart toward opposite poles.`,`Copy the DNA a second time.`,`Push every chromosome to the same pole.`],ok:0,
   why:`The spindle fibers shorten and pull the sister chromatids apart. DNA was already copied during S phase, so it is not copied again.`},
  {q:`The separated chromatids have reached the poles. What happens in telophase?`,
   opts:[`The chromosomes condense and the nuclear envelope breaks down.`,`The chromosomes line up in the middle again.`,`A new nuclear envelope forms around each set of chromosomes, and the chromosomes begin to uncoil.`],ok:2,
   why:`Telophase is close to the reverse of prophase. Two nuclei re-form, the spindle disappears, and the chromosomes relax back into loose chromatin.`},
  {q:`The cell now has two nuclei. In an animal cell, how does cytokinesis divide the cytoplasm?`,
   opts:[`The membrane pinches inward, forming a cleavage furrow.`,`The two nuclei fuse back together.`,`The DNA is copied again before the cell splits.`],ok:0,
   why:`A ring of protein fibers tightens at the middle of the cell and pinches it in two. Plant cells cannot pinch because of their cell wall, so they build a cell plate instead.`}
];

const QS=[
  {q:`What is the main result of mitosis?`,
   opts:[`Four cells with half the chromosome number of the parent`,`Two genetically identical cells with the same chromosome number as the parent`,`Two cells with different DNA`,`One cell with double the chromosomes`],ok:1,
   why:`Mitosis makes two daughter cells that are genetically identical to the parent cell. Making four cells with half the chromosomes describes meiosis.`},
  {q:`A body cell with 8 chromosomes (2n = 8) goes through mitosis. How many chromosomes are in each daughter cell?`,
   opts:[`4`,`8`,`16`,`2`],ok:1,
   why:`Mitosis keeps the chromosome number the same, so each daughter cell has 8 chromosomes.`},
  {q:`The same cell (2n = 8) is in metaphase. How many chromatids does it have?`,
   opts:[`8`,`4`,`32`,`16`],ok:3,
   why:`The cell has 8 chromosomes, and each one has 2 sister chromatids after S phase. 8 x 2 = 16 chromatids.`},
  {q:`Which event marks the start of anaphase?`,
   opts:[`The nuclear envelope re-forms.`,`Chromosomes line up in the middle.`,`The DNA is copied.`,`Sister chromatids separate.`],ok:3,
   why:`Anaphase begins when the sister chromatids separate and start moving to opposite poles.`},
  {q:`In a typical growing tissue, which part of the cell cycle takes up most of the time?`,
   opts:[`Interphase`,`Prophase`,`Anaphase`,`Cytokinesis`],ok:0,
   why:`Cells spend most of their time in interphase growing, copying DNA, and preparing to divide. The stages of mitosis are much shorter.`},
  {q:`What is the job of the spindle fibers?`,
   opts:[`Copy the DNA`,`Build the new cell wall`,`Move and separate the chromosomes`,`Make the nuclear envelope`],ok:2,
   why:`Spindle fibers attach to chromosomes and move them to the middle of the cell and then apart to the poles.`},
  {q:`How does cytokinesis differ between plant and animal cells?`,
   opts:[`Plant cells form a cell plate, and animal cells pinch in with a cleavage furrow.`,`Plant cells pinch in, and animal cells form a cell plate.`,`Only animal cells go through cytokinesis.`,`Plant cells skip telophase.`],ok:0,
   why:`A plant cell has a rigid cell wall, so it builds a new wall (the cell plate) down the middle. An animal cell has no wall, so its membrane pinches in.`},
  {q:`A cut on your arm heals when new skin cells replace the damaged ones. Which process makes the new skin cells?`,
   opts:[`Meiosis`,`Fertilization`,`Mitosis`,`Binary fission`],ok:2,
   why:`Mitosis supports growth and repair in body cells. Binary fission is how bacteria reproduce, and meiosis makes gametes.`},
  {q:`A healthy cell finds damaged DNA before it enters mitosis. What is the most likely result?`,
   opts:[`The cell divides faster to avoid the damage.`,`The cell skips cytokinesis.`,`The cell pauses at a checkpoint so the DNA can be repaired, or the cell self-destructs if it cannot be fixed.`,`The cell goes straight to anaphase.`],ok:2,
   why:`Checkpoints act as quality control. If the damage cannot be repaired, the cell is usually directed to die rather than pass on faulty DNA.`},
  {q:`Cancer cells divide again and again without stopping. Which statement best explains why?`,
   opts:[`Their cell cycle controls, such as checkpoints, are not working properly.`,`They skip interphase.`,`They divide by meiosis.`,`They have no DNA to copy.`],ok:0,
   why:`Mutations in genes that control the cell cycle can break the checkpoints, so the cell keeps dividing even when it should stop.`}
];

const SHORT_PROMPT=`Use your slide data from Part 3. Which phase did you count the most cells in? Explain what that tells you about how long a cell spends in that phase.`;
const SHORT_PTS=3;
/* ---------- helpers ---------- */
const TOK={};
const TK=['ink','muted','line','stain','stain2','stain-soft','teal','teal-soft','cyto','wall','field','surface','ok','bad','focus'];
function readTokens(){const cs=getComputedStyle(document.documentElement);TK.forEach(k=>{TOK[k]=cs.getPropertyValue('--'+k).trim();});}
const lerp=(a,b,f)=>a+(b-a)*f, ease=f=>f*f*(3-2*f), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}

/* ---------- animated cell model (2n = 4) ---------- */
const NUC=[1,.35,0,0,0,0], DNUC=[0,0,0,0,.55,1], COND=[.12,.75,1,1,.8,.25], REACH=[0,.3,1,1,.7,0];
const SPREAD=[0,.6,1,1,1,1], BEND=[0,0,0,1,1,1], PINCH=[0,0,0,0,.25,.95], PLATE=[0,0,0,0,.35,1];
const SC=[[-24,-18],[22,-26],[-18,24],[27,17]], SC2=[[-38,-30],[34,-38],[-34,32],[38,26]];
const PLT=[-54,-18,18,54].map(y=>[0,y]);
const AY=[-46,-16,16,46], TY=[-30,-10,10,30], CY=[-22,-8,8,22];
const POSA=[SC,SC2,PLT,AY.map(y=>[-64,y]),TY.map(y=>[-108,y]),CY.map(y=>[-108,y])];
const POSB=[SC,SC2,PLT,AY.map(y=>[64,y]),TY.map(y=>[108,y]),CY.map(y=>[108,y])];
const CHR_L=[60,60,40,40];
function K(a,t){t=clamp(t,0,5);if(t>=5)return a[5];const i=Math.floor(t);return lerp(a[i],a[i+1],ease(t-i));}
function KP(tab,t,i){t=clamp(t,0,5);if(t>=5)return tab[5][i];const s=Math.floor(t),f=ease(t-s),a=tab[s][i],b=tab[s+1][i];return[lerp(a[0],b[0],f),lerp(a[1],b[1],f)];}

function chromatid(ctx,cx,cy,a1,a2,L,lw,col,wob,ph){
  const arm=a=>{const p=[],N=7;for(let k=0;k<=N;k++){const r=L/2*k/N,w=wob*Math.sin(r*.28+ph)*Math.min(1,k/2);p.push([cx+Math.cos(a)*r-Math.sin(a)*w,cy+Math.sin(a)*r+Math.cos(a)*w]);}return p;};
  const p1=arm(a1),p2=arm(a2);
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();

function animalPath(ctx,Rx,Ry,p){

const CW=420, CH=280;
function drawCell(cv,t,mode){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||CW,pw=Math.round(w*dpr),ph=Math.round(w*CH/CW*dpr);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const s=cv.width/CW;ctx.setTransform(s,0,0,s,CW/2*s,CH/2*s);
  const Rx=195,Ry=125,pinch=K(PINCH,t),plate=K(PLATE,t);
  ctx.fillStyle=TOK.cyto;ctx.strokeStyle=TOK.wall;ctx.lineWidth=3;
  if(mode==='plant'){
    rr(ctx,-Rx,-Ry,2*Rx,2*Ry,16);ctx.fill();ctx.stroke();
    if(plate>0){ctx.lineWidth=2+plate*3;ctx.setLineDash(plate<1?[6,5]:[]);ctx.beginPath();ctx.moveTo(0,-Ry*plate);ctx.lineTo(0,Ry*plate);ctx.stroke();ctx.setLineDash([]);}
  }else{animalPath(ctx,Rx,Ry,pinch);ctx.fill();ctx.stroke();}

  const nuc=K(NUC,t),dn=K(DNUC,t);
  if(nuc>.01){ctx.globalAlpha=nuc;ctx.fillStyle=TOK['teal-soft'];ctx.strokeStyle=TOK.teal;ctx.lineWidth=2.5;circ(ctx,0,0,72);ctx.fill();ctx.stroke();
    ctx.fillStyle=TOK['stain-soft'];ctx.strokeStyle=TOK.stain;ctx.lineWidth=1.5;circ(ctx,12,-4,9);ctx.fill();ctx.stroke();ctx.globalAlpha=1;}
  if(dn>.01){ctx.globalAlpha=dn;ctx.fillStyle=TOK['teal-soft'];ctx.strokeStyle=TOK.teal;ctx.lineWidth=2.5;[-1,1].forEach(sg=>{circ(ctx,sg*108,0,52);ctx.fill();ctx.stroke();});ctx.globalAlpha=1;}

  const sp=K(SPREAD,t),px=lerp(14,166,sp),py=lerp(-92,0,sp),reach=K(REACH,t);

      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(lerp(px,b[0],reach),lerp(py,b[1],reach));ctx.stroke();}
    ctx.globalAlpha=1;}
  ctx.fillStyle=TOK.teal;ctx.strokeStyle=TOK.surface;ctx.lineWidth=2;[-1,1].forEach(sg=>{circ(ctx,sg*px,py,6.5);ctx.fill();ctx.stroke();});

    chromatid(ctx,b[0],b[1],lerp(Math.PI-.3,Math.PI+.55,bend),lerp(-.3,Math.PI-.55,bend),L,lw,col,wob,i*1.7+.8);
  }

}

/* ---------- root tip slide ---------- */
function drawSlideCell(ctx,x,y,size,ph,seed){
  const r=rng(seed),u=size/100;ctx.save();ctx.translate(x,y);ctx.scale(u,u);
  const w=86+r()*8,h=86+r()*8;
  ctx.fillStyle=TOK.cyto;ctx.strokeStyle=TOK.wall;ctx.lineWidth=2.5;rr(ctx,-w/2,-h/2,w,h,9);ctx.fill();ctx.stroke();
  const ang=r()*Math.PI,ax=[Math.cos(ang),Math.sin(ang)],pe=[-ax[1],ax[0]];
  const P=(a,b)=>[ax[0]*a+pe[0]*b,ax[1]*a+pe[1]*b];
  const seg=(p,q,wd,col,al)=>{ctx.globalAlpha=al||1;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.globalAlpha=1;};
  const colr=k=>k%2?TOK.stain2:TOK.stain;
  if(ph===0){
    const ox=(r()-.5)*10,oy=(r()-.5)*10,nr=22+r()*4;
    ctx.fillStyle=TOK['stain-soft'];ctx.strokeStyle=TOK.stain;ctx.lineWidth=2;circ(ctx,ox,oy,nr);ctx.fill();ctx.stroke();
    ctx.fillStyle=TOK.stain;circ(ctx,ox+(r()-.5)*8,oy+(r()-.5)*8,6);ctx.fill();
    ctx.globalAlpha=.55;for(let k=0;k<9;k++){const a=r()*6.28,d=r()*(nr-5);circ(ctx,ox+Math.cos(a)*d,oy+Math.sin(a)*d,1.5);ctx.fill();}ctx.globalAlpha=1;
  }else if(ph===1){
    const ox=(r()-.5)*8,oy=(r()-.5)*8;
    ctx.setLineDash([3,3]);ctx.strokeStyle=TOK.stain;ctx.globalAlpha=.5;ctx.lineWidth=1.6;circ(ctx,ox,oy,26);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    for(let k=0;k<7;k++){const a=r()*6.28,d=r()*14,sx=ox+Math.cos(a)*d,sy=oy+Math.sin(a)*d,b=r()*6.28,len=15+r()*9;
      ctx.strokeStyle=colr(k);ctx.lineWidth=3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);
      ctx.quadraticCurveTo(sx+Math.cos(b)*len*.5+Math.sin(b)*7,sy+Math.sin(b)*len*.5-Math.cos(b)*7,sx+Math.cos(b)*len,sy+Math.sin(b)*len);ctx.stroke();}
  }else if(ph===2){
    for(let k=0;k<6;k++){const b=(k-2.5)*11;seg(P(-42,0),P(0,b),1,TOK.teal,.35);seg(P(42,0),P(0,b),1,TOK.teal,.35);}
    for(let k=0;k<6;k++){const b=(k-2.5)*11;seg(P(-8,b-3),P(8,b+3),3.6,colr(k));seg(P(-8,b+3),P(8,b-3),3.6,colr(k));}
  }else if(ph===3){
    const d=17;
    for(let k=0;k<6;k++){const b=(k-2.5)*10;[-1,1].forEach(sg=>{
      const tip=P(sg*d,b),a1=P(sg*(d-10),b-4),a2=P(sg*(d-10),b+4);
      ctx.strokeStyle=colr(k);ctx.lineWidth=3.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a1[0],a1[1]);ctx.lineTo(tip[0],tip[1]);ctx.lineTo(a2[0],a2[1]);ctx.stroke();});}
  }else{
    ctx.setLineDash([5,4]);seg(P(0,-40),P(0,40),3,TOK.wall);ctx.setLineDash([]);
    [-1,1].forEach(sg=>{const c=P(sg*27,0);
      ctx.fillStyle=TOK['stain-soft'];ctx.strokeStyle=TOK.stain;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c[0],c[1],8,21,ang,0,Math.PI*2);ctx.fill();ctx.stroke();
      for(let k=0;k<5;k++){const q=P(sg*27+(r()-.5)*6,(k-2)*7.5);seg(q,[q[0]+ax[0]*5,q[1]+ax[1]*5],2.6,colr(k),.85);}});
  }
  ctx.restore();
}
const SW=500, SH=800;
function drawSlide(cv,SL,ids,sel,done){
  const d=window.devicePixelRatio||1,w=cv.clientWidth||SW;cv.width=Math.round(w*d);cv.height=Math.round(w*d*SH/SW);
  const ctx=cv.getContext('2d'),s=cv.width/SW;ctx.setTransform(s,0,0,s,0,0);ctx.fillStyle=TOK.field;ctx.fillRect(0,0,SW,SH);
  SL.forEach((c,i)=>{
    const cx=(i%5)*100+50,cy=Math.floor(i/5)*100+50;drawSlideCell(ctx,cx,cy,100,c.p,c.s);
    ctx.font='500 10px '+getComputedStyle(document.body).getPropertyValue('--font-mono');ctx.fillStyle=TOK.muted;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(String(i+1),cx-44,cy+44);
    const id=ids[i];
    if(id!=null){
      const ok=id===c.p,txt=done&&!ok?PC[id]+'>'+PC[c.p]:PC[id],bw=txt.length>1?36:20;
      ctx.fillStyle=done?(ok?TOK.ok:TOK.bad):TOK.ink;rr(ctx,cx+46-bw,cy-46,bw,18,5);ctx.fill();
      ctx.fillStyle=TOK.surface;ctx.font='700 12px '+getComputedStyle(document.body).getPropertyValue('--font-mono');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,cx+46-bw/2,cy-37);

const KEY='mitosis-lab-v1';

const app=$('#app');
function fresh(){return{name:'',period:'',started:0,finished:0,step:'welcome',
  p1:{ans:[null,null,null,null,null],chk:[0,0,0,0,0],reached:0},
  p2:{order:[],done:0},
  p3:{ids:Array(40).fill(null),done:0,pct:['','','','',''],mins:['',''],calc:0},
  p4:{ans:Array(10).fill(null),chk:Array(10).fill(0)},short:''};}
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=fresh(), SL=[];
function seed(){return hashStr((S.name||'').trim().toLowerCase()+'|'+S.period);}
function buildSlide(){const r=rng(seed()+13),a=[];COUNTS.forEach((c,p)=>{for(let i=0;i<c;i++)a.push(p);});
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  SL=a.map(p=>({p,s:Math.floor(r()*1e9)}));}
function p2Cards(){const r=rng(seed()+7);let a=[1,2,3,4,5];
  for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((v,i)=>v===i+1))a=[2,3,4,5,1];return a;}

function sc(){
  const p1=S.p1.ans.reduce((n,a,i)=>n+(a===PRED[i].ok?1:0),0);
  const cards=p2Cards(),p2=S.p2.done?S.p2.order.reduce((n,k,pos)=>n+(cards[k]===pos+1?1:0),0):0;
  const ids=S.p3.ids,right=ids.reduce((n,v,i)=>n+(SL[i]&&v===SL[i].p?1:0),0),p3id=S.p3.done?Math.round(right/40*10):0;
  const cnt=PH.map((_,p)=>ids.filter(v=>v===p).length),pct=cnt.map(c=>c/40*100);
  const exp=[...pct,pct[0]/100*1440,pct[2]/100*1440],got=[...S.p3.pct,...S.p3.mins].map(v=>parseFloat(v));
  const tol=[1,1,1,1,1,15,15],okc=exp.map((e,i)=>Number.isFinite(got[i])&&Math.abs(got[i]-e)<=tol[i]);
  const calc=S.p3.calc?okc.filter(Boolean).length:0;
  const p4=S.p4.ans.reduce((n,a,i)=>n+(S.p4.chk[i]&&a===QS[i].ok?1:0),0);
  return{p1,p2,right,p3id,cnt,pct,exp,got,okc,calc,p4,total:p1+p2+p3id+calc+p4,max:37,cards};

/* ---------- shell ---------- */

function sc(){
  ensureCustomState();
  const p1=S.p1.ans.reduce((n,a,i)=>n+(a===PRED[i].ok?1:0),0);
  const cards=p2Cards(),p2=S.p2.done?S.p2.order.reduce((n,k,pos)=>n+(cards[k]===pos+1?1:0),0):0;
  const c=S.p3.counts.map(v=>parseInt(v,10));
  const actual=[27,6,3,2,2];
  const countOK=actual.map((v,i)=>Number.isFinite(c[i])&&c[i]===v);
  const p3count=S.p3.countChecked?countOK.filter(Boolean).length:0;
  const pct=actual.map(v=>v/40*100),exp=[...pct,pct[0]/100*1440,pct[2]/100*1440];
  const got=[...S.p3.pct,...S.p3.mins].map(v=>parseFloat(v));
  const tol=[1,1,1,1,1,15,15],okc=exp.map((e,i)=>Number.isFinite(got[i])&&Math.abs(got[i]-e)<=tol[i]);
  const calc=S.p3.calc?okc.filter(Boolean).length:0;
  const focus=[0,3,4];
  const p4=focus.reduce((n,i)=>n+(S.p4.chk[i]&&S.p4.ans[i]===QS[i].ok?1:0),0);
  return{p1,p2,p3count,countOK,actual,pct,exp,got,okc,calc,p4,total:p1+p2+p3count+calc+p4,max:25,cards};
}

function viewP3(){

  const lockCounts=S.p3.countChecked&&r.countOK.every(Boolean);
  const countRows=PH.map((n,i)=>`<tr><td>${n}</td><td><input id="ct${i}" type="number" min="0" max="40" inputmode="numeric" value="${esc(S.p3.counts[i])}" ${lockCounts?'disabled':''}></td>${S.p3.countChecked?`<td>${r.countOK[i]?'<span class="tag ok">Correct</span>':'<span class="tag bad">Check again</span>'}</td>`:''}</tr>`).join('');
  const calcRows=PH.map((n,i)=>`<tr><td>${n}</td><td class="num">${r.actual[i]}</td><td><input id="pct${i}" type="number" step="any" inputmode="decimal" value="${esc(S.p3.pct[i])}" ${S.p3.calc?'disabled':''}> %</td>${S.p3.calc?`<td>${r.okc[i]?'<span class="tag ok">Correct</span>':'<span class="tag bad">Expected '+r.exp[i].toFixed(1)+'</span>'}</td>`:''}</tr>`).join('');

      <p>The onion root tip is a growing region, so its cells are found in different stages of the cell cycle. Your job is to <strong>scan the entire 40-cell field</strong> and tally how many cells are in each stage. You are not answering 40 separate questions.</p>
      <div class="submit-alert"><strong>How to work asynchronously</strong>Use the reference strip first. Scan row by row so you do not count a cell twice. Record a tally on paper if that helps, then enter only your final totals below. Your five counts must add to 40.</div>
      <div class="refstrip">${ref}</div></div>
    <div class="slidewrap single"><div class="panel" style="padding:10px"><canvas class="scope" id="slidecv" role="img" aria-label="Virtual microscope field of 40 onion root tip cells, five across and eight down"></canvas></div></div>
    <div class="panel stack"><div><h3>Step A — Enter your tally</h3><p>Count every cell in the field exactly once.</p></div>
      <div class="scroll"><table class="tbl"><tr><th>Stage</th><th>Your count</th>${S.p3.countChecked?'<th>Check</th>':''}</tr>${countRows}<tr><td><b>Total</b></td><td class="num" id="cttotal">${S.p3.counts.reduce((a,v)=>a+(parseInt(v,10)||0),0)}</td>${S.p3.countChecked?'<td></td>':''}</tr></table></div>
      ${S.p3.countChecked?`<div class="fb">${r.countOK.every(Boolean)?'<b class="ok">Counts verified.</b> Nice work. Continue to the calculations below.':'<b class="bad">Some counts need another look.</b> Re-scan the stage(s) marked “Check again.” The lab does not reveal the number yet.'}</div>`:''}
      ${S.p3.countChecked&&r.countOK.every(Boolean)?'':`<div><button class="btn primary" id="checkCountsBtn">Check my tally</button></div>`}
    </div>
    ${S.p3.countChecked&&r.countOK.every(Boolean)?`<div class="panel stack"><div><h3>Step B — Calculate from the verified counts</h3><p>Percent = cells in stage ÷ 40 × 100. Assume a full cycle takes 24 hours (1,440 minutes). Estimate minutes in interphase and metaphase from the percentage of cells observed in each stage.</p></div>
      <div class="scroll"><table class="tbl"><tr><th>Stage</th><th>Verified count</th><th>Percent of 40</th>${S.p3.calc?'<th>Check</th>':''}</tr>${calcRows}</table></div>
      <div class="scroll"><table class="tbl"><tr><th>Estimate</th><th>Your answer</th>${S.p3.calc?'<th>Check</th>':''}</tr>
        <tr><td>Minutes in interphase</td><td><input id="min0" type="number" step="any" value="${esc(S.p3.mins[0])}" ${S.p3.calc?'disabled':''}> min</td>${S.p3.calc?`<td>${r.okc[5]?'<span class="tag ok">Correct</span>':'<span class="tag bad">Expected '+r.exp[5].toFixed(1)+'</span>'}</td>`:''}</tr>
        <tr><td>Minutes in metaphase</td><td><input id="min1" type="number" step="any" value="${esc(S.p3.mins[1])}" ${S.p3.calc?'disabled':''}> min</td>${S.p3.calc?`<td>${r.okc[6]?'<span class="tag ok">Correct</span>':'<span class="tag bad">Expected '+r.exp[6].toFixed(1)+'</span>'}</td>`:''}</tr>
      </table></div>
      ${S.p3.calc?`<div class="fb"><b class="${r.okc.every(Boolean)?'ok':'bad'}">${r.okc.filter(Boolean).length} of 7 calculations correct.</b> ${r.okc.every(Boolean)?'Longer-lasting stages are more likely to appear in a random snapshot of many cells.':'Use the formulas above to check any marked calculation.'}</div>`:''}
      <div class="row">${S.p3.calc?'<button class="btn primary" data-act="to" data-to="p4">Continue to Part 4</button>':'<button class="btn primary" id="checkCalcBtn">Check calculations</button>'}</div>
    </div>`:''}
  </div>`;
  const paint=()=>{const cv=$('#slidecv');if(cv)drawSlide(cv,SL,Array(40).fill(null),-1,true);$$('.refstrip canvas').forEach(c=>{const d=window.devicePixelRatio||1,w=c.clientWidth||100;c.width=c.height=Math.round(w*d);const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);drawSlideCell(x,c.width/2,c.height/2,c.width*.98,+c.dataset.ph,31+(+c.dataset.ph)*17);});};
  window.__redraw=paint;paint();
  for(let i=0;i<5;i++){const el=$('#ct'+i);if(el)el.addEventListener('input',()=>{S.p3.counts[i]=el.value;save();const t=$('#cttotal');if(t)t.textContent=S.p3.counts.reduce((a,v)=>a+(parseInt(v,10)||0),0);});}
  const cb=$('#checkCountsBtn');if(cb)cb.addEventListener('click',()=>{S.p3.countChecked=1;save();viewP3();window.scrollTo(0,0);});

function focusedQ(i){return qcard(i);}

    ${focusedQ(0)}${focusedQ(3)}${focusedQ(4)}
    <div class="panel stack"><div><div class="eyebrow">Authentic axolotl evidence</div><h3 style="margin-top:4px">What does proliferation evidence tell us?</h3></div>
      <div class="axo-placeholder"><div><b>🦎 AXOLOTL REGENERATION IMAGE / DATA GOES HERE</b><span class="muted">In Canvas, insert the published open-access axolotl proliferation image or teacher-provided evidence figure here.</span></div></div>
      <p>Imagine the evidence shows substantially more cells entering or moving through the cell cycle in regenerating tissue after injury than in comparable uninjured tissue. Which conclusion is best supported?</p>
      <div class="opts" id="axoOpts">
        <label class="opt"><input type="radio" name="axo" value="0"><span>Mitosis alone explains every step required to rebuild an entire limb.</span></label>
        <label class="opt"><input type="radio" name="axo" value="1"><span>Increased cell proliferation contributes to producing more cells during regeneration.</span></label>
        <label class="opt"><input type="radio" name="axo" value="2"><span>Every cell near an injury must divide at exactly the same rate.</span></label>
      </div>
      <div class="fb" id="axoFb">Choose the claim that matches the evidence without going beyond it.</div>
    </div>
    <div class="panel stack"><div><div class="eyebrow">Short conclusion · scored by your teacher (${SHORT_PTS} points)</div><h3 style="margin-top:4px">Use evidence from Part 3 and the axolotl evidence to explain how cell division contributes to regeneration. Also state one thing this evidence does <em>not</em> explain.</h3></div>
      <div class="field"><label for="short" class="muted" style="font-weight:400">Write at least 2–4 complete sentences.</label><textarea id="short">${esc(S.short)}</textarea></div>
      <div class="row"><button class="btn primary" data-act="finish" disabled>See my results</button><span class="muted" id="gate"></span></div></div></div>`;

  $$('input[name="axo"]').forEach(r=>r.addEventListener('change',()=>{S.axo=+r.value;save();$$('#axoOpts .opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));const fb=$('#axoFb');if(S.axo===1){fb.innerHTML='<b class="ok">Good evidence boundary.</b> Increased proliferation can help provide more cells for repair, but it does not by itself explain specialization, patterning, or when division stops.';}else{fb.innerHTML='<b class="bad">That claim overreaches.</b> The evidence supports increased proliferation, not the entire regeneration process.';}updGates();}));
  const sa=$('#short');if(sa)sa.addEventListener('input',()=>{S.short=sa.value;save();updGates();});
  updGates();
}

function updGates(){
  const f=$('[data-act="finish"]');
  if(f){const focus=[0,3,4],allq=focus.every(i=>S.p4.chk[i]),axo=S.axo===1,sa=S.short.trim().length>=40;f.disabled=!(allq&&axo&&sa);const g=$('#gate');if(g)g.textContent=!allq?'Check all three questions first.':!axo?'Complete the axolotl evidence question.':!sa?'Add your 2–4 sentence conclusion.':'';}
}

      <div class="kv"><div><b>${esc(S.period)}</b><span>Class period</span></div><div><b>${esc(when)}</b><span>Finished</span></div><div><b>${mins} min</b><span>Time on lab</span></div><div><b>${checkCode(r)}</b><span>Check code</span></div></div>
      <div class="kv"><div><b>${r.p1} / 5</b><span>Part 1 predictions</span></div><div><b>${r.p2} / 5</b><span>Part 2 order</span></div><div><b>${r.p3count} / 5</b><span>Part 3 tally</span></div><div><b>${r.calc} / 7</b><span>Part 3 calculations</span></div><div><b>${r.p4} / 3</b><span>Part 4 focus questions</span></div><div><b>? / ${SHORT_PTS}</b><span>Conclusion (teacher)</span></div></div></div>
    <div class="panel stack"><div class="submit-alert"><strong>📸 STOP: YOU MUST SUBMIT THIS RESULTS PAGE IN CANVAS</strong>
      <ol class="stepshot"><li><b>Take a screenshot of the TOP of this Results page</b> so your name, score, class period, finished time, and check code are visible.</li><li>Save the screenshot to your device.</li><li>Return to the <b>3.9 Virtual Lab assignment in Canvas</b>.</li><li>Upload the screenshot as your submission. Do not submit a screenshot from an earlier part of the lab.</li></ol>

function resultsText(){
  const r=sc(),L=[];L.push('THE REGENERATION FILES 3.9 — MITOSIS VIRTUAL LAB RESULTS',`Name: ${S.name}`,`Class period: ${S.period}`,`Finished: ${new Date(S.finished).toLocaleString()}`,`Auto-scored total: ${r.total} / ${r.max} (conclusion worth ${SHORT_PTS} points is scored by teacher)`,`Check code: ${checkCode(r)}`,'',`Part 1 predictions: ${r.p1} / 5`,`Part 2 order: ${r.p2} / 5`,`Part 3 tally: ${r.p3count} / 5`,`Part 3 calculations: ${r.calc} / 7`,`Part 4 focus questions: ${r.p4} / 3`,'','Part 3 tally: '+PH.map((n,i)=>`${n} ${S.p3.counts[i]}`).join(', '),'','Conclusion:',S.short);return L.join('\n');
