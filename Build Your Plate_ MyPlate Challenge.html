<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Your Plate: MyPlate Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --text:#0f172a; --muted:#334155; --line:#64748b; --soft:#cbd5e1;
  --primary:#1e3a8a; --primary-text:#ffffff; --tint:#e3ebfb;
  --good-bg:#e5f5e9; --good-line:#1b6e2e; --info-bg:#e3effb; --info-line:#0b5cad; --warn-bg:#fff2cf; --warn-line:#8a5a00;
  --reading:#fff1a8; --reading-line:#7a5b00; --focus:#0f172a; --halo:#ffffff;
  --c-fruits:#b3261e; --c-vegetables:#1b6e2e; --c-grains:#8a4b00; --c-protein:#6a2c91; --c-dairy:#0b5cad;
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#162033; --text:#f1f5f9; --muted:#d5dde8; --line:#94a3b8; --soft:#334155;
    --primary:#a9c4ff; --primary-text:#0b1220; --tint:#223356;
    --good-bg:#12361f; --good-line:#6fcf8a; --info-bg:#112f4d; --info-line:#7db8f0; --warn-bg:#3b3010; --warn-line:#f0c56a;
    --focus:#f1f5f9; --halo:#0b1220;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#162033; --text:#f1f5f9; --muted:#d5dde8; --line:#94a3b8; --soft:#334155;
  --primary:#a9c4ff; --primary-text:#0b1220; --tint:#223356;
  --good-bg:#12361f; --good-line:#6fcf8a; --info-bg:#112f4d; --info-line:#7db8f0; --warn-bg:#3b3010; --warn-line:#f0c56a;
  --focus:#f1f5f9; --halo:#0b1220;
}
html{scroll-padding-top:calc(var(--sticky-h,0px) + env(safe-area-inset-top,0px) + 12px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1.2rem;line-height:1.55}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.25rem}
p{margin:0 0 .8em}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--primary-text);padding:12px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus{outline:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 7px var(--halo)}
.wrap{max-width:1040px;margin:0 auto;padding:12px 16px 40px}

/* Read Aloud toolbar */
.toolbar{background:var(--card);border-bottom:3px solid var(--line);padding:10px 16px;z-index:30}
.toolbar .in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .lbl{font-weight:700;margin-right:4px}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:1.05rem}
.toolbar select{font:inherit;font-size:1.05rem;min-height:48px;padding:6px 10px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
#raStatus{font-size:1.05rem;color:var(--muted);min-width:5.5em}
#raMsg{max-width:1040px;margin:8px auto 0;padding:10px 14px;border:3px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;font-size:1.05rem}
@media (min-width:720px) and (min-height:640px){.toolbar{position:sticky;top:env(safe-area-inset-top,0px)}}

/* Buttons */
.btn{font:inherit;font-size:1.1rem;font-weight:700;min-height:52px;padding:10px 20px;border:3px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:48px;padding:8px 14px;font-size:1.05rem}
.btn[aria-disabled="true"]{border-style:dashed;cursor:not-allowed;opacity:.75}
.btn.primary[aria-disabled="true"]{background:var(--card);color:var(--text);border-color:var(--line)}

/* Progress */
#progress{margin:14px 0 8px}
.steptext{font-weight:700;margin-bottom:6px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar>div{height:100%;background:var(--primary)}
.steps{list-style:none;display:flex;gap:8px;padding:0;margin:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--soft);border-radius:999px;font-size:1.05rem;background:var(--card)}
.step .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:.95rem}
.step.current{border:3px solid var(--primary);font-weight:700}
.step.current .n{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.step.done .n{background:var(--good-line);color:#fff;border-color:var(--good-line)}
@media (max-width:620px){.step:not(.current) .nm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.step:not(.current){padding:6px}}

/* Screens */
.screen{background:var(--card);border:2px solid var(--soft);border-radius:18px;padding:22px 22px 18px;margin-top:8px}
.eyebrow{margin:0 0 4px;color:var(--muted);font-size:1.05rem}
.titlerow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.titlerow h1{margin:0}
.lead{font-size:1.25rem}
.hint{border:3px solid var(--info-line);background:var(--info-bg);padding:12px 16px;border-radius:12px;margin:8px 0 14px}
.callout{border-left:8px solid var(--primary);background:var(--tint);padding:14px 18px;border-radius:10px;margin:12px 0 18px;font-size:1.25rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.sticky-col{position:static}
@media (min-width:861px) and (min-height:700px){.sticky-col{position:sticky;top:calc(var(--sticky-h,0px) + env(safe-area-inset-top,0px) + 12px)}}
.scene{border:2px dashed var(--line);border-radius:12px;padding:12px 16px;margin:10px 0 16px;background:var(--bg)}

/* Plate */
.plate{margin:0;text-align:center}
.plate-svg{width:100%;max-width:470px;height:auto}
.plate-svg text{font-family:var(--font)}
.plate figcaption{font-size:1.05rem;color:var(--muted);margin-top:4px}
.count{font-size:1.25rem;margin:6px 0}
.chips{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;text-align:left}
.chips li{display:flex;gap:8px;align-items:baseline;padding:8px 12px;border:2px solid var(--soft);border-radius:10px;font-size:1.05rem;background:var(--card)}
.chips li.on{border:3px solid var(--good-line);background:var(--good-bg)}
.chips .mk{font-weight:700;min-width:1.2em}

/* Food cards */
.gtag{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding:6px 14px;border-radius:10px;font-size:1.15rem;margin:14px 0 8px}
.gtag.fruits{background:var(--c-fruits)} .gtag.vegetables{background:var(--c-vegetables)} .gtag.grains{background:var(--c-grains)} .gtag.protein{background:var(--c-protein)} .gtag.dairy{background:var(--c-dairy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.food{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center;min-height:138px;padding:12px 10px;border:3px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;cursor:pointer;position:relative}
.food:hover{background:var(--tint)}
.food .em{font-size:2.4rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.food .nm{font-weight:700;font-size:1.15rem;line-height:1.2}
.food .nt{font-size:1rem;color:var(--muted)}
.food .st{font-size:1rem;font-weight:700;margin-top:auto;padding:2px 10px;border-radius:999px;border:2px solid var(--soft)}
.food[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);box-shadow:0 0 0 3px var(--primary)}
.food[aria-pressed="true"] .st{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.food[aria-pressed="true"]:focus-visible{box-shadow:0 0 0 3px var(--primary),0 0 0 8px var(--halo)}

/* Group buttons */
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0 14px}
.gbtn{font:inherit;font-size:1.15rem;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:60px;padding:10px 12px;border:3px solid transparent;border-radius:12px;color:#fff;cursor:pointer;text-align:center}
.gbtn.fruits{background:var(--c-fruits)} .gbtn.vegetables{background:var(--c-vegetables)} .gbtn.grains{background:var(--c-grains)} .gbtn.protein{background:var(--c-protein)} .gbtn.dairy{background:var(--c-dairy)}
.gbtn .em{font-size:1.6rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gbtn .tick{font-size:1rem;background:rgba(255,255,255,.95);color:#111;border-radius:999px;padding:0 8px}
.gbtn[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 4px var(--text),inset 0 0 0 3px #fff;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:3px}
.gbtn:hover{filter:brightness(1.1)}

.panel{border:3px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:8px;background:var(--card)}
.panel .ex{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0}
.panel .ex li{border:2px solid var(--soft);border-radius:999px;padding:4px 12px;font-size:1.05rem;background:var(--bg)}
.panel .ex .e{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* Feedback */
.fb{border:3px solid var(--info-line);background:var(--info-bg);border-radius:14px;padding:14px 18px;margin:16px 0}
.fb.good{border-color:var(--good-line);background:var(--good-bg)}
.fb.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.fb h2{font-size:1.3rem;margin-bottom:.4em}
.fb ul{margin:.3em 0 .8em;padding-left:1.3em}
.fb li{margin-bottom:.35em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.tab{font:inherit;font-size:1.1rem;font-weight:700;min-height:52px;padding:8px 16px;border:3px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-text)}
.tab .ck{margin-left:6px}
.bigfood{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;border:3px solid var(--line);border-radius:16px;padding:18px;margin:10px 0 14px;background:var(--bg)}
.bigfood div{text-align:center;min-width:120px}
.bigfood .em{font-size:3.6rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bigfood .nm{font-weight:700;font-size:1.15rem}
.bottomnav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:3px solid var(--soft)}
.navnote{flex:1 1 220px;text-align:center;margin:0;color:var(--muted);font-size:1.05rem}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.sg{border:3px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.sg h3{display:flex;gap:8px;align-items:center;margin-bottom:.3em}
.big{font-size:1.4rem}
.reading,.reading *{color:#111827!important}
.reading{background:var(--reading)!important;outline:4px dashed var(--reading-line);outline-offset:2px;border-radius:8px}
details{border:2px solid var(--soft);border-radius:12px;padding:10px 14px;margin-top:16px}
summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}

/* ===== Fun / color pass ===== */
:root{--pgrad:linear-gradient(135deg,#1d4ed8,#6d28d9);--page:linear-gradient(160deg,#dbe8ff 0%,#f1e6ff 48%,#ffe6f0 100%);--ch:#0b5cad;--sc:#0b5cad}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pgrad:linear-gradient(135deg,#a9c4ff,#dcc6ff);--page:linear-gradient(160deg,#0b1220 0%,#1a1240 55%,#2a0f2e 100%)}}
:root[data-theme="dark"]{--pgrad:linear-gradient(135deg,#a9c4ff,#dcc6ff);--page:linear-gradient(160deg,#0b1220 0%,#1a1240 55%,#2a0f2e 100%)}
body{background-color:var(--bg);background-image:var(--page);background-attachment:fixed}
.topbar{max-width:1040px;margin:12px auto 0;padding:0 16px}
.topbar-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1e3a8a,#6d28d9 62%,#be185d);color:#fff;border-radius:16px 16px 0 0;padding:10px 18px}
.brand{font-weight:700;font-size:1.35rem}
.score{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border:2px solid #fff;border-radius:999px;padding:3px 14px;font-weight:700;font-size:1.05rem;color:#fff}
.stripe{height:10px;border-radius:0 0 16px 16px;background:linear-gradient(90deg,var(--c-fruits) 0 20%,var(--c-vegetables) 20% 40%,var(--c-grains) 40% 60%,var(--c-protein) 60% 80%,var(--c-dairy) 80% 100%)}
.screen{border-top:12px solid var(--ch);box-shadow:0 10px 30px rgba(40,20,100,.18)}
.s1{--ch:#0b5cad}.s2{--ch:#1b6e2e}.s3{--ch:#8a4b00}.s4{--ch:#6a2c91}.s5{--ch:#b3261e}.s6{--ch:#be185d}.s7{--ch:#6d28d9}.s0{--ch:#6d28d9}
.eyebrow{display:inline-block;background:var(--ch);color:#fff;padding:2px 14px;border-radius:999px;font-weight:700;font-size:1.05rem}
.btn.primary{background:var(--pgrad);color:var(--primary-text);border-color:transparent}
.tab[aria-pressed="true"]{background:var(--pgrad);border-color:transparent}
.bar>div{background:linear-gradient(90deg,var(--c-fruits),var(--c-grains),var(--c-vegetables),var(--c-dairy),var(--c-protein))}
.step.current{border-color:var(--sc)}
.step.current .n,.step.done .n{background:var(--sc);border-color:var(--sc);color:#fff}
.plate{background:radial-gradient(circle at 50% 35%,var(--card),var(--tint));border:3px solid var(--soft);border-radius:22px;padding:12px 10px}
.scene{border:3px solid var(--ch);background:var(--card);border-radius:16px}
.food{border-top-width:10px}
.food.gc-fruits{border-top-color:var(--c-fruits)}.food.gc-vegetables{border-top-color:var(--c-vegetables)}.food.gc-grains{border-top-color:var(--c-grains)}.food.gc-protein{border-top-color:var(--c-protein)}.food.gc-dairy{border-top-color:var(--c-dairy)}
.food[aria-pressed="true"] .em{transform:scale(1.15)}
.food.gc-fruits[aria-pressed="true"]{border-color:var(--c-fruits);box-shadow:0 0 0 3px var(--c-fruits)}
.food.gc-vegetables[aria-pressed="true"]{border-color:var(--c-vegetables);box-shadow:0 0 0 3px var(--c-vegetables)}
.food.gc-grains[aria-pressed="true"]{border-color:var(--c-grains);box-shadow:0 0 0 3px var(--c-grains)}
.food.gc-protein[aria-pressed="true"]{border-color:var(--c-protein);box-shadow:0 0 0 3px var(--c-protein)}
.food.gc-dairy[aria-pressed="true"]{border-color:var(--c-dairy);box-shadow:0 0 0 3px var(--c-dairy)}
.food.gc-fruits[aria-pressed="true"] .st{background:var(--c-fruits);border-color:var(--c-fruits);color:#fff}
.food.gc-vegetables[aria-pressed="true"] .st{background:var(--c-vegetables);border-color:var(--c-vegetables);color:#fff}
.food.gc-grains[aria-pressed="true"] .st{background:var(--c-grains);border-color:var(--c-grains);color:#fff}
.food.gc-protein[aria-pressed="true"] .st{background:var(--c-protein);border-color:var(--c-protein);color:#fff}
.food.gc-dairy[aria-pressed="true"] .st{background:var(--c-dairy);border-color:var(--c-dairy);color:#fff}
.hero{background:linear-gradient(135deg,#1e3a8a,#6d28d9 60%,#be185d);color:#fff;border-radius:18px;padding:26px 24px;margin-bottom:16px}
.hero h1{font-size:2.5rem;color:#fff;margin:.25em 0}
.hero p{color:#fff;font-size:1.25rem;margin:0 0 .6em}
.gpills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gpill{color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid #fff;font-size:1.05rem}
.missions{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.missions li{border:3px solid var(--soft);border-left:12px solid var(--mc);border-radius:12px;padding:8px 14px;background:var(--card)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.badge{border:3px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.badge.on{border-style:solid;border-color:var(--good-line);background:var(--good-bg)}
.badge h3{margin-bottom:.2em}
.bigscore{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0}
.bigscore .pill{font-size:1.25rem;padding:6px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#screen">Skip to the game</a>

<div class="toolbar" id="toolbar" role="region" aria-label="Read Aloud controls">
  <div class="in">
    <span class="lbl" aria-hidden="true">Listen:</span>
    <button type="button" class="btn primary small" id="raPlay">🔊 Read Aloud</button>
    <button type="button" class="btn small" id="raPause" aria-disabled="true">⏸ Pause</button>
    <button type="button" class="btn small" id="raReplay">↻ Replay</button>
    <button type="button" class="btn small" id="raStop" aria-disabled="true">⏹ Stop</button>
    <label>Speed
      <select id="raRate" aria-label="Reading speed">
        <option value="0.6">Very slow</option>
        <option value="0.8">Slow</option>
        <option value="0.95" selected>Normal</option>
        <option value="1.2">Fast</option>
      </select>
    </label>
    <span id="raStatus">Ready</span>
  </div>
  <div id="raMsg" role="alert" hidden></div>
</div>

<div class="topbar"><div class="topbar-in"><div class="brand"><span aria-hidden="true">🍽️</span> Build Your Plate</div>
<div class="score" role="group" aria-label="Your score"><span class="pill">⭐ <span id="ptsN">0</span> Plate Points</span><span class="pill" id="lvl">Level: Rookie</span></div></div><div class="stripe" aria-hidden="true"></div></div>
<div class="wrap">
  <div id="progress" hidden></div>
  <main id="screen" class="screen" tabindex="-1" aria-label="Game"></main>
</div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};

/* ============ DATA ============ */
var GK=['fruits','vegetables','grains','protein','dairy'];
var G={
 fruits:{name:'Fruits',emoji:'🍎',sample:['🍎','🍌'],
  purpose:'Fruits give your body natural carbohydrates for energy, plus fiber, vitamin C, and potassium.',
  counts:'Fresh, frozen, canned, and dried fruit all count, and so does 100% fruit juice. Whole fruit is a great choice because it also gives fiber.',
  active:'A banana or an orange is an easy, quick source of energy before or after movement.',
  role:'adds vitamins, fiber, and natural energy',
  ex:[['🍎','Apple'],['🍌','Banana'],['🍊','Orange'],['🍓','Strawberries'],['🍇','Grapes'],['🥭','Mango']]},
 vegetables:{name:'Vegetables',emoji:'🥦',sample:['🥦','🥕'],
  purpose:'Vegetables give your body fiber, vitamins A and C, potassium, and other minerals.',
  counts:'Dark green, red and orange, starchy, and other vegetables all count. Fresh, frozen, and canned count too. Beans, peas, and lentils can count as a vegetable or as a protein food. In this game, they are placed in Protein foods.',
  active:'Colorful vegetables help the body work well all day, including during exercise.',

function render(){
 var a=document.activeElement,fid=a&&a.dataset?a.dataset.fid:null;
 var sc=$('#screen');
 sc.className='screen s'+S.screen;
 sc.innerHTML=SCREENS[S.screen]();
 updateProgress();updateScore();
 if(fid){var t=sc.querySelector('[data-fid="'+fid+'"]');if(t)t.focus({preventScroll:true})}
}
function go(n){
 Speech.stop();S.screen=n;S.hint=false;render();
 var h=$('#screenTitle');if(h)h.focus({preventScroll:true});
 window.scrollTo(0,0);
}
function afterFeedback(fb){
 announce(fbText(fb));
 var el=$('#fb');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});
}

/* ============ ACTIONS ============ */
function act(a,d){
 if(a==='readfb'){Speech.play('#screen .fbread');return}
 Speech.stop();
 var c;
 switch(a){
 case 'start':go(1);return;
 case 'back':go(Math.max(0,S.screen-1));return;
 case 'next':
  if(!canContinue()){announce(lockMsg());return}
  go(S.screen+1);return;
 case 'again':S=fresh();go(0);return;
 case 'hint':S.hint=!S.hint;render();return;
 /* challenge 1 */
 case 'demoNext':S.c1.demo=Math.min(DEMO.length-1,S.c1.demo+1);render();announce('Step '+(S.c1.demo+1)+' of 4. '+DEMO[S.c1.demo].t);return;
 case 'demoPrev':S.c1.demo=Math.max(0,S.c1.demo-1);render();announce('Step '+(S.c1.demo+1)+' of 4. '+DEMO[S.c1.demo].t);return;
 case 'startExplore':S.c1.part=1;render();var h=$('#screenTitle');if(h)h.focus({preventScroll:true});announce('Now explore the five food groups.');return;
 case 'exploreGroup':
  if(S.c1.part!==1)return;
  S.c1.sel=d.g;if(S.c1.seen.indexOf(d.g)<0)S.c1.seen.push(d.g);
  render();announce(G[d.g].name+'. '+G[d.g].purpose+' Explored '+S.c1.seen.length+' of 5 groups.');
  var pn=$('#screen .panel');if(pn&&pn.scrollIntoView)pn.scrollIntoView({block:'nearest'});
  return;
 /* challenge 2 */
 case 'toggle2':
  c=S.c2;var on=toggle(c.picked,d.id);c.fb=null;render();
  announce(F[d.id].n+(on?' added to':' removed from')+' the plate. The plate has '+filledCount(byGroup(c.picked))+' of 5 food groups.');return;
 case 'check2':check2();return;
 /* challenge 3 */
 case 'meal':S.c3.meal=+d.m;render();var h3=$('#screenTitle');announce(MEALS[S.c3.meal].title);return;
 case 'toggle3':
  c=S.c3;var on3=toggle(c.picked[c.meal],d.id);c.fb[c.meal]=null;render();
  announce(F[d.id].n+(on3?' added.':' removed.')+' The plate has '+filledCount(byGroup(MEALS[c.meal].base.concat(c.picked[c.meal])))+' of 5 food groups.');return;
 case 'check3':check3();return;
 /* challenge 4 */
 case 'toggle4':c=S.c4;toggle(c.sel[c.round],d.g);c.fb[c.round]=null;render();return;
 case 'check4':check4();return;
 case 'reveal4':reveal4();return;
 case 'next4':S.c4.round=Math.min(ROUNDS.length-1,S.c4.round+1);render();announce('Food '+(S.c4.round+1)+' of 6. '+ROUNDS[S.c4.round].title);return;
 case 'prev4':S.c4.round=Math.max(0,S.c4.round-1);render();announce('Food '+(S.c4.round+1)+' of 6. '+ROUNDS[S.c4.round].title);return;
 /* challenge 5 */
 case 'toggle5':
  c=S.c5;var on5=toggle(c.picked,d.id);c.fb=null;render();
  announce(F[d.id].n+(on5?' added to':' removed from')+' the plate. The plate has '+filledCount(byGroup(c.picked))+' of 5 food groups.');return;
 case 'check5':check5();return;
 /* boss round */
 case 'meal6':S.boss.meal=+d.m;render();announce(BOSS[S.boss.meal].title);return;
 case 'toggle6':c=S.boss;toggle(c.sel[c.meal],d.g);c.fb[c.meal]=null;render();return;
 case 'check6id':check6id();return;
 case 'reveal6':reveal6();return;
 case 'pick6':c=S.boss;c.pick[c.meal]=c.pick[c.meal]===d.id?null:d.id;c.fb[c.meal]=null;render();return;
 case 'check6up':check6up();return;
 }
}

function check2(){
 var c=S.c2,by=byGroup(c.picked),present=GK.filter(function(g){return by[g].length}),missing=GK.filter(function(g){return!by[g].length});
 if(!c.picked.length){c.fb={tone:'warn',title:'Pick a few foods first',paras:['Select food cards to build Maya\'s lunch, then press Check my plate again.'],list:[]};render();afterFeedback(c.fb);return}
 S.done[2]=true;S.best.c2=Math.max(S.best.c2,present.length);
 var list=present.map(function(g){return'<b>'+G[g].name+':</b> '+names(by[g])+' '+G[g].role+'.'});
 if(!missing.length)c.fb={tone:'good',title:'Balanced plate! All five food groups are here.',
  paras:['Maya\'s lunch has something from every MyPlate group. Together these foods give her energy for practice, nutrients for muscles and bones, and variety.','This is only one of many balanced lunches. You could swap any food for another in the same group and still be balanced.'],list:list};
 else c.fb={tone:'info',title:'Good start: '+present.length+' of 5 food groups.',
  paras:['Not on the plate yet: <b>'+listNames(missing)+'</b>. Try adding one food from each missing group. You can change any card, and you can check as many times as you like.'],list:list};
 c.fb.paras.push(ptsLine());render();afterFeedback(c.fb);
}
function check3(){
 var cc=S.c3,m=cc.meal,M=MEALS[m],picks=cc.picked[m];
 var baseBy=byGroup(M.base),baseG=GK.filter(function(g){return baseBy[g].length});
 if(!picks.length){cc.fb[m]={tone:'warn',title:'Choose at least one food to add',paras:[M.who+'\'s meal has '+listNames(baseG)+'. Pick foods to add from the cards, then check again.'],list:[]};render();afterFeedback(cc.fb[m]);return}
 var allBy=byGroup(M.base.concat(picks)),total=filledCount(allBy);
 var added=byGroup(picks),newG=GK.filter(function(g){return added[g].length&&baseG.indexOf(g)<0});S.best.c3[m]=Math.max(S.best.c3[m],newG.length);var sameG=GK.filter(function(g){return added[g].length&&baseG.indexOf(g)>=0});
 var missing=GK.filter(function(g){return!allBy[g].length});
 var list=newG.map(function(g){return'<b>'+G[g].name+':</b> '+names(added[g])+' '+G[g].role+'. This is a new group on the plate.'})
  .concat(sameG.map(function(g){return'<b>'+G[g].name+':</b> '+names(added[g])+' adds more variety within a group that was already on the plate. Choosing different foods in a group is a good habit, but it does not add a new group.'}));
 var title,tone='good';
 if(total===5)title='All five food groups are now on the plate!';
 else if(newG.length>=2)title='Great improvement! You added '+newG.length+' new food groups.';
 else if(newG.length===1){title='Nice addition! You added 1 new food group.';tone='info'}
 else{title='You added variety within the groups already there.';tone='info'}
 var paras=[M.who+'\'s meal already had '+listNames(baseG)+', which is a solid start.'];
 if(missing.length)paras.push('Groups still empty: <b>'+listNames(missing)+'</b>. Add a food from one of them if you want to see more variety. You can change your choices any time.');
 else paras.push('Many different additions could work, so your choices are one good answer, not the only one.');
 paras.push(ptsLine());cc.fb[m]={tone:tone,title:title,paras:paras,list:list};cc.done[m]=true;
 render();afterFeedback(cc.fb[m]);
}
function evalRound(R,sel){
 var req=R.req,eith=R.either||[],allowed=req.slice();eith.forEach(function(s){s.forEach(function(g){allowed.push(g)})});
 var missReq=req.filter(function(g){return sel.indexOf(g)<0}),extra=sel.filter(function(g){return allowed.indexOf(g)<0}),missEither=eith.filter(function(s){return!s.some(function(g){return sel.indexOf(g)>=0})});
 return{ok:!missReq.length&&!extra.length&&!missEither.length,missing:missReq.length+missEither.length,extra:extra.length,right:sel.length-extra.length};
}
function check4(){
 var c=S.c4,i=c.round,R=ROUNDS[i],sel=c.sel[i];
 if(!sel.length){c.fb[i]={tone:'warn',title:'Select at least one food group',paras:['Choose the group or groups that fit, then press Check my answer.'],list:[]};render();afterFeedback(c.fb[i]);return}
 var r=evalRound(R,sel);
 if(r.ok){c.status[i]=c.status[i]==='none'?'correct':c.status[i];c.fb[i]={tone:'good',title:'Correct!',paras:[R.explain],list:[]};c.fb[i].paras.push(ptsLine())}
 else{
  var p=[];
  if(r.extra)p.push('At least one group you chose does not match this food. Look at each food again.');
  if(r.missing)p.push('There is at least one more group to find.');
  p.push('Clue: '+R.clue);
  c.fb[i]={tone:'info',title:'Not quite yet. You can try again.',paras:p,list:[]};
 }
 render();afterFeedback(c.fb[i]);
}
function reveal4(){
 var c=S.c4,i=c.round,R=ROUNDS[i];
 var ans=R.req.slice();(R.either||[]).forEach(function(s){ans.push(s[0])});
 c.sel[i]=ans;c.status[i]='revealed';
 c.fb[i]={tone:'info',title:'Here is the answer: '+listNames(ans)+(R.either?' (the beans can be '+listNames(R.either[0])+')':''),paras:[R.explain,'You can use Previous food to try it again later.'],list:[]};
 render();afterFeedback(c.fb[i]);
}
function check5(){
 var c=S.c5,by=byGroup(c.picked),present=GK.filter(function(g){return by[g].length}),missing=GK.filter(function(g){return!by[g].length});
 if(!c.picked.length){c.fb={tone:'warn',title:'Pick a few foods first',paras:['Select foods for Jordan\'s dinner, then press Check my meal.'],list:[]};render();afterFeedback(c.fb);return}
 S.done[5]=true;S.best.c5=Math.max(S.best.c5,present.length);if(!missing.length)S.best.c5bal=true;
 var list=present.map(function(g){return'<b>'+G[g].name+':</b> '+names(by[g])+' '+G[g].role+'.'});
 if(!missing.length)c.fb={tone:'good',title:'Balanced dinner! All five food groups are on the plate.',
  paras:['Jordan\'s dinner has variety and covers every MyPlate group, which supports energy for a track meet, muscle recovery, and strong bones.','Another student might choose different foods and also build a balanced plate.'],list:list};
 else c.fb={tone:'info',title:present.length+' of 5 food groups so far.',
  paras:['Not on the plate yet: <b>'+listNames(missing)+'</b>. Swap or add a food to bring in more variety, then check again. When you are ready, press Continue.'],list:list};
 c.fb.paras.push(ptsLine());render();afterFeedback(c.fb);
}

function bossFb(m,fb){S.boss.fb[m]=fb;render();afterFeedback(fb)}
function check6id(){
 var B=S.boss,m=B.meal,M=BOSS[m],sel=B.sel[m];
 if(!sel.length){bossFb(m,{tone:'warn',title:'Select at least one food group',paras:['Choose the groups you see in this meal, then press Check my groups.'],list:[]});return}
 var r=evalRound({req:M.groups},sel);
 if(r.ok){if(B.id[m]==='none')B.id[m]='correct';bossFb(m,{tone:'good',title:'Correct! You found every group.',paras:[M.explain,'Now pick a smart upgrade in Step 2.',ptsLine()],list:[]})}
 else{var p=[];if(r.extra)p.push('At least one group you chose is not in this meal. Look at each food one at a time.');if(r.missing)p.push('There is at least one more group to find.');
  bossFb(m,{tone:'info',title:'Not quite yet. You can try again.',paras:p,list:[]})}
}
function reveal6(){
 var B=S.boss,m=B.meal,M=BOSS[m];
 B.sel[m]=M.groups.slice();if(B.id[m]==='none')B.id[m]='revealed';
 bossFb(m,{tone:'info',title:'Here is the answer: '+listNames(M.groups),paras:[M.explain,'Now pick a smart upgrade in Step 2.'],list:[]});
}
function check6up(){
 var B=S.boss,m=B.meal,M=BOSS[m],id=B.pick[m];
 if(!id){bossFb(m,{tone:'warn',title:'Choose a food first',paras:['Select one food card, then press Check my upgrade.'],list:[]});return}
 var f=F[id],g=f.g;
 if(M.missing.indexOf(g)>=0){
  B.up[m]=true;
  var left=M.missing.filter(function(x){return x!==g});
  bossFb(m,{tone:'good',title:'Smart upgrade! You added a new food group.',paras:[f.n+' is in the '+G[g].name+' group, which this meal was missing.',
   left.length?'Groups still missing: <b>'+listNames(left)+'</b>. You could keep upgrading in real life.':'Now the meal has all five groups.',ptsLine()],list:[]});
 }else bossFb(m,{tone:'info',title:'Try a different upgrade.',paras:[f.n+' is in the '+G[g].name+' group, which is already in this meal. Think about which group is not in the meal yet, then choose a food from it.'],list:[]});
}

document.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-action]'):null;
 if(!t||!$('#screen').contains(t))return;
 act(t.getAttribute('data-action'),t.dataset);
});

/* ============ READ ALOUD ============ */
var Speech=(function(){
 var ok=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
 var queue=[],idx=0,state='idle',rate=0.95,token=0,voice=null,lastSel='#screen .rd',cur=null,keep=null;
 var bPlay=$('#raPlay'),bPause=$('#raPause'),bReplay=$('#raReplay'),bStop=$('#raStop'),sel=$('#raRate'),stat=$('#raStatus'),msg=$('#raMsg');
 function say(t){msg.textContent=t;msg.hidden=false}
 function clean(t){return String(t).replace(/[\u2714\u2713\u25CB\u2192\u2190\u21BB\u23F8\u25B6\u23F9]/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]/gu,' ').replace(/\s+/g,' ').trim()}
 function chunk(t){var parts=t.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[t],out=[],buf='';
  parts.forEach(function(p){if((buf+p).length>200&&buf){out.push(buf.trim());buf=p}else buf+=p});
  if(buf.trim())out.push(buf.trim());return out}
 function build(selector){var out=[];$$(selector).forEach(function(el){
   if(el.closest('[hidden]'))return;
   var raw=el.hasAttribute('data-read')?el.getAttribute('data-read'):(el.innerText||el.textContent);
   var t=clean(raw);if(!t)return;chunk(t).forEach(function(c){out.push({el:el,text:c})})});return out}
 function pickVoice(){if(!ok)return;var vs=speechSynthesis.getVoices()||[];
  var en=vs.filter(function(v){return/^en[-_]US/i.test(v.lang)});var pref=/(natural|google us english|samantha|aria|jenny|zira|alex)/i;
  voice=en.filter(function(v){return pref.test(v.name)})[0]||en[0]||vs.filter(function(v){return/^en/i.test(v.lang)})[0]||null}
 function mark(el){unmark();if(el){el.classList.add('reading');cur=el;if(el.scrollIntoView)el.scrollIntoView({block:'nearest'})}}
 function unmark(){if(cur){cur.classList.remove('reading');cur=null}$$('.reading').forEach(function(x){x.classList.remove('reading')})}
 function ui(){
  bPause.textContent=state==='paused'?'▶ Resume':'⏸ Pause';
  bPause.setAttribute('aria-disabled',state==='idle'?'true':'false');
  bStop.setAttribute('aria-disabled',state==='idle'?'true':'false');
  stat.textContent=state==='playing'?'Reading…':state==='paused'?'Paused':state==='finished'?'Finished':'Ready';
 }
 function speakNow(my){
  if(my!==token)return;
  if(idx>=queue.length){state='finished';unmark();ui();return}
  var item=queue[idx];
  var live=item.el&&item.el.isConnected?item.el:null;
  mark(live);
  var u=new SpeechSynthesisUtterance(item.text);
  u.lang='en-US';u.rate=rate;u.pitch=1;if(voice)u.voice=voice;
  u.onend=function(){if(my!==token)return;idx++;speakNow(my)};
  u.onerror=function(ev){if(my!==token)return;if(ev&&(ev.error==='canceled'||ev.error==='interrupted'))return;
   token++;state='idle';idx=0;unmark();ui();say('Read Aloud ran into a problem in this browser. All text is still on the screen.')};
  keep=u;
  speechSynthesis.speak(u);
 }
 function startLater(){var my=++token;try{speechSynthesis.cancel()}catch(e){}setTimeout(function(){speakNow(my)},60)}
 function unsupported(){say('Read Aloud is not available in this browser. All directions, questions, and feedback are written on the screen. Try current Chrome, Edge, or Safari to use Read Aloud.')}
 var api={
  supported:ok,
  play:function(selector){
   if(!ok){unsupported();return}
   msg.hidden=true;
   try{speechSynthesis.cancel()}catch(e){}token++;unmark();
   lastSel=selector||'#screen .rd';queue=build(lastSel);idx=0;
   if(!queue.length){state='idle';ui();return}
   if(!voice)pickVoice();
   state='playing';ui();startLater();
  },
  pauseToggle:function(){
   if(!ok){unsupported();return}
   if(state==='playing'){state='paused';token++;try{speechSynthesis.cancel()}catch(e){}ui()}
   else if(state==='paused'){state='playing';ui();startLater()}
  },
  replay:function(){api.play(lastSel)},
  stop:function(){
   if(!ok)return;
   token++;try{speechSynthesis.cancel()}catch(e){}
   state='idle';idx=0;queue=[];unmark();ui();
  },
  setRate:function(r){rate=r;if(state==='playing')startLater()}
 };
 if(!ok){unsupported();[bPlay,bPause,bReplay,bStop].forEach(function(b){b.setAttribute('aria-disabled','true')});sel.disabled=true;stat.textContent='Not available'}
 else{pickVoice();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',pickVoice);else speechSynthesis.onvoiceschanged=pickVoice}
 bPlay.addEventListener('click',function(){api.play('#screen .rd')});
 bPause.addEventListener('click',function(){if(bPause.getAttribute('aria-disabled')==='true')return;api.pauseToggle()});
 bReplay.addEventListener('click',function(){api.replay()});
 bStop.addEventListener('click',function(){if(bStop.getAttribute('aria-disabled')==='true')return;api.stop()});
 sel.addEventListener('change',function(){api.setRate(parseFloat(sel.value))});
 window.addEventListener('pagehide',function(){if(ok)try{speechSynthesis.cancel()}catch(e){}});
 ui();
 return api;
})();
